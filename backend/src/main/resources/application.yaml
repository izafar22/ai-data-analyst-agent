spring:
  application:
    name: ai-data-analyst
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analyst}
    username: ${POSTGRES_USER:analyst_migration}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: ai-data-analyst
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analyst}
    username: ${POSTGRES_USER:analyst_migration}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never
analytics:
  username: analyst_readonly
  password: ${ANALYTICS_PASSWORD}
  pool-size: ${ANALYTICS_POOL_SIZE:3}
  statement-timeout-ms: 2000
  lock-timeout-ms: 500
  max-response-bytes: 1048576
